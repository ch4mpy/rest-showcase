issuer: https://oidc.c4-soft.com/auth/realms/rest-showcase
bidule-api-port: 8081
machin-api-port: 8082

server:
  port: ${bidule-api-port}
  ssl:
    bundle: server
spring:
  application:
    name: bidule-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${issuer}
          principal-claim-name: preferred_username
  ssl:
    bundle:
      pem:
        server:
          keystore:
            certificate: classpath:tls.crt
            private-key: classpath:tls.key
            private-key-password: change-me