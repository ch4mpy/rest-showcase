issuer: https://host.docker.internal/auth/realms/rest-showcase
bidule-api-port: 8081
machin-api-port: 8082

server:
  port: ${machin-api-port}
  ssl:
    bundle: server

spring:
  application:
    name: bidule-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${issuer}
          principal-claim-name: preferred_username
  ssl:
    bundle:
      pem:
        client:
          truststore:
            certificate: classpath:tls.crt
        server:
          keystore:
            certificate: classpath:tls.crt
            private-key: classpath:tls.key
            private-key-password: change-me

logging:
  level:
    org:
      springframework:
        security: DEBUG