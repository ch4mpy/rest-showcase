issuer: https://host.docker.internal/auth/realms/rest-showcase
bidule-api-port: 8081
bidule-base-uri: https://localhost:${bidule-api-port}
machin-api-port: 8082
machin-base-uri: https://localhost:${machin-api-port}

server:
  port: 8083
  ssl:
    bundle: server

spring:
  application:
    name: chouette-api
  security:
    oauth2:
      client:
        provider:
          sso:
           issuer-uri: ${issuer}
        registration:
          bidule-registration:
            provider: sso
            authorization-grant-type: client_credentials
            client-id: chouette-api
            client-secret: 8pwcgj61ZrFOsAr6vZrhucgZrvfgGTmf
            scope: openid
      resourceserver:
        jwt:
          issuer-uri: ${issuer}
  ssl:
    bundle:
      pem:
        client:
          truststore:
            certificate: classpath:tls.crt
        server:
          keystore:
            certificate: classpath:tls.crt
            private-key: classpath:tls.key
            private-key-password: change-me

com:
  c4-soft:
    springaddons:
      rest:
        client:
          machin-client:
            base-url: ${machin-base-uri}
            group: machin
            http:
              client-http-request-factory-impl: jdk
            authorization:
              oauth2:
                forward-bearer: true
            ssl-bundle: client
            expose-builder: true
          bidule-client:
            base-url: ${bidule-base-uri}
            group: bidule
            authorization:
              oauth2:
                oauth2-registration-id: bidule-registration
            ssl-bundle: client
            expose-builder: true
logging:
  level:
    '[org.springframework]': TRACE